<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14235a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جامعة العين">
<title>جامعة العين العراقية</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#69728a;--pr:#2f5bea;--pr2:#e8eeff;--bd:#e3e6ef;--wa:#c2410c;--wb:#fff1e6;--ok:#0f7b4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#1a1f2d;--tx:#eef1f8;--mu:#9aa3bb;--pr:#7c9bff;--pr2:#232b45;--bd:#2a3144;--wa:#fdba74;--wb:#3a2616;--ok:#5fd6a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131c;--card:#1a1f2d;--tx:#eef1f8;--mu:#9aa3bb;--pr:#7c9bff;--pr2:#232b45;--bd:#2a3144;--wa:#fdba74;--wb:#3a2616;--ok:#5fd6a0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
h1{font-size:19px;margin:0}
.brand{display:flex;align-items:center;gap:10px}.logo{height:54px;width:auto;background:#fff;border-radius:10px;padding:3px;border:1px solid var(--bd)}
.lb{display:grid;font-size:12px;color:var(--mu);gap:2px}.lb.full{grid-column:1/-1}.lb input{font-size:15px;color:var(--tx)}.fl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.tg{font-size:12px;font-weight:600;background:var(--pr2);color:var(--pr);border-radius:99px;padding:1px 8px;margin-inline-start:6px;white-space:nowrap}
.bell{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:12px;width:42px;height:42px;font-size:19px;cursor:pointer;color:var(--tx)}
.bell b{position:absolute;top:-6px;left:-6px;background:#dc2626;color:#fff;font-size:11px;border-radius:99px;min-width:19px;height:19px;line-height:19px;text-align:center;padding:0 4px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font:inherit;font-weight:600;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--pr);color:#fff}
.tabs{margin:12px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.t{font-weight:700}.m{color:var(--mu);font-size:14px}
.day{font-weight:700;color:var(--pr);margin:16px 2px 4px}
.pill{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
.alert{background:var(--wb);color:var(--wa);border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:600}
.new{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr2)}
form.add{display:grid;gap:8px;grid-template-columns:1fr 1fr}
form.add .full{grid-column:1/-1}
input,select,textarea,button.go{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
button.go{background:var(--pr);color:#fff;border:0;font-weight:700;cursor:pointer}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer;padding:0 4px}
.empty{text-align:center;color:var(--mu);padding:26px 0}
.hint{font-size:12px;color:var(--mu);margin-top:6px}

.bell{display:grid;place-items:center;padding:0}
.bell svg,.ti svg,.sic svg,.back svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.bell svg{width:22px;height:22px;stroke-width:1.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{position:relative;border:0;border-radius:22px;padding:16px 15px 15px;color:#fff;text-align:start;font:inherit;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;box-shadow:0 8px 18px rgba(20,35,90,.25);overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile::after{content:"";position:absolute;inset-inline-end:-34px;bottom:-34px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.11)}
.ti{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.ti svg{width:30px;height:30px;stroke-width:1.8}
.tl{display:block;font-size:18px;font-weight:800;line-height:1.3}
.ts{display:block;font-size:13px;opacity:.9;margin-top:2px}
.tb{position:absolute;top:12px;inset-inline-end:12px;background:#ef4444;color:#fff;font-size:12px;min-width:23px;height:23px;line-height:23px;text-align:center;border-radius:99px;padding:0 6px;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.sh{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.sh h2{margin:0;font-size:19px;line-height:1.3}
.back{width:42px;height:42px;border-radius:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.back svg{width:22px;height:22px;stroke-width:2}
.sic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.sic svg{width:24px;height:24px;stroke-width:1.9}
.row>div:first-child{min-width:0;flex:1}
.row>div:last-child{flex:none}
.tg{white-space:normal;display:inline-block;margin-top:3px}
.pill{white-space:nowrap}
html,body{overflow-x:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;position:relative;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:15px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;display:grid;justify-items:center;min-width:66px;-webkit-tap-highlight-color:transparent}
.chip small{font-weight:600;color:var(--mu);font-size:12px}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff;box-shadow:0 4px 10px rgba(47,91,234,.3)}
.chip.on small{color:rgba(255,255,255,.88)}
.chip .dot{position:absolute;top:6px;inset-inline-end:7px;width:7px;height:7px;border-radius:50%;background:#ef4444}
.lec{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--bd);border-inline-start:5px solid var(--pr);border-radius:16px;padding:12px;margin:9px 0}
.lec.lab{border-inline-start-color:#0f9d6b}
.lec .tm{flex:none;width:60px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px;font-variant-numeric:tabular-nums}
.lec .tm b{font-size:17px}
.lec .tm span{font-size:13px;color:var(--mu)}
.lec .bd{flex:1;min-width:0;border-inline-start:1px solid var(--bd);padding-inline-start:12px}
.lec .ac{flex:none;align-self:flex-start;white-space:nowrap}
.kd{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;margin-inline-end:6px;background:var(--pr2);color:var(--pr)}
.lec.lab .kd{background:rgba(15,157,107,.14);color:#0f9d6b}
.now{background:#ef4444;color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;margin-inline-start:6px}
.chip{--c:#2f5bea;background:color-mix(in srgb,var(--c) 13%,var(--card));border-color:color-mix(in srgb,var(--c) 45%,transparent);color:var(--c)}
.chip small{color:var(--c);opacity:.85}
.chip.on{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));border-color:var(--c);color:#fff;box-shadow:0 5px 12px color-mix(in srgb,var(--c) 45%,transparent)}
.chip.on small{color:#fff;opacity:.92}
.lec{--c:#2f5bea;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 11%,var(--card)),var(--card) 70%);border-color:color-mix(in srgb,var(--c) 30%,transparent);border-inline-start:5px solid var(--c)}
.lec.lab{border-inline-start-color:var(--c)}
.lec .tm{background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 62%,#000));color:#fff;border-radius:12px;padding:8px 4px;width:64px}
.lec .tm span{color:rgba(255,255,255,.85)}
.lec .bd{border-inline-start:0;padding-inline-start:0}
.kd,.lec.lab .kd{background:var(--c);color:#fff}
.lec.lab .kd{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.day{color:var(--c,var(--tx))}
</style>
</head>

<script>
var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var S={role:"student",tab:"home",courses:[],exams:[],notes:[]};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function seenGet(c){try{var v=localStorage.getItem("seen_"+c);return v===null?null:JSON.parse(v)}catch(e){return null}}
function seenSet(c,a){try{localStorage.setItem("seen_"+c,JSON.stringify(a))}catch(e){}}
function notify(t,b){try{if(!("Notification" in window)||Notification.permission!=="granted")return;navigator.serviceWorker.getRegistration().then(function(r){var o={body:b,icon:"icon-192.png",badge:"icon-192.png",dir:"rtl",lang:"ar"};if(r)r.showNotification(t,o);else new Notification(t,o)})}catch(e){}}
function checkNew(c){
  if(REAL!=="student"||!S.ready)return;
  var ids=S[c].map(function(x){return x.id}),old=seenGet(c);
  if(old!==null){S[c].filter(match).filter(function(x){return old.indexOf(x.id)<0}).forEach(function(x){
    if(c==="notes")notify("📢 تبليغ جديد: "+x.title,x.body||"");
    else notify("📝 امتحان جديد: "+x.course,(x.kind?x.kind+" · ":"")+x.date+" "+(x.time||"")+(x.room?" · قاعة "+x.room:""))})}
  seenSet(c,ids);
}
function readSet(){try{return JSON.parse(localStorage.getItem("readNotes")||"[]")}catch(e){return[]}}
function saveRead(a){try{localStorage.setItem("readNotes",JSON.stringify(a))}catch(e){}}
function unread(){var r=readSet();return S.notes.filter(match).filter(function(n){return r.indexOf(n.id)<0}).length}

var SEED={courses:[],exams:[],notes:[]};
try{SEED=JSON.parse($("data").textContent)}catch(e){}
var APP_VERSION=1,REAL="student",db=null,auth=null;
function setRole(r){S.ready=true;REAL=r;S.view=r;S.role=r==="student"?"student":"prof";if(r==="student")S.edit=null;render()}
function fail(){alert("تعذّر الحفظ: ليست لديك صلاحية أو لا يوجد اتصال.")}
function add(col,o){if(db)db.collection(col).add(o).catch(fail)}
function del(col,id){if(db&&confirm("هل تريد الحذف؟"))db.collection(col).doc(id).delete().catch(fail)}
function save(col,id,o){if(db)db.collection(col).doc(id).update(o).then(function(){S.edit=null;render()}).catch(fail)}
function seedAll(){
  if(!db||!confirm("استيراد البيانات الأولية إلى قاعدة البيانات؟"))return;
  ["courses","exams","notes"].forEach(function(c){(SEED[c]||[]).forEach(function(o){var x=Object.assign({},o);delete x.id;var r=db.collection(c);(o.id?r.doc(o.id).set(x):r.add(x)).catch(fail)})});
}
var CF=window.FIREBASE_CONFIG;
if(!window.firebase||!CF||CF.apiKey==="YOUR_API_KEY"){
  S.ready=true;
  $("cfg").innerHTML='<div class="alert">⚠️ لم تُضبط إعدادات Firebase بعد. عدّل الملف firebase-config.js.</div>';
}else{
  firebase.initializeApp(CF);db=firebase.firestore();auth=firebase.auth();
  db.enablePersistence({synchronizeTabs:true}).catch(function(){});
  ["courses","exams","notes"].forEach(function(c){db.collection(c).onSnapshot(function(s){S[c]=s.docs.map(function(d){var o=d.data();o.id=d.id;return o});if(c!=="courses")checkNew(c);render()},function(){})});
  db.collection("meta").doc("app").onSnapshot(function(d){var x=d.data()||{};S.upd=(x.latest>APP_VERSION)?x:null;render()},function(){});
  auth.onAuthStateChanged(function(u){
    if(!u){setRole("student");return}
    db.collection("admins").doc(u.uid).get().then(function(d){S.login=false;setRole(d.exists?(d.data().role==="dev"?"dev":"prof"):"student")}).catch(function(){setRole("student")});
  });
}
function loginCard(){
  var u=S.upd?'<div class="alert">🔄 يتوفر إصدار جديد من التطبيق. <a href="'+esc(S.upd.url||"#")+'">تحديث الآن</a></div>':"";
  return u+(S.login?'<div class="card"><div class="t" style="margin-bottom:8px">دخول الأساتذة</div><form class="add" data-f="login"><input class="full" type="email" name="email" placeholder="البريد الإلكتروني" required><input class="full" type="password" name="pass" placeholder="كلمة المرور" required><button class="go full">دخول</button><button type="button" class="go full" style="background:var(--mu)" data-forgot="1">نسيت كلمة المرور؟</button></form></div>':"");
}
function authMsg(e){
  var c=(e&&e.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return"البريد أو كلمة المرور غير صحيحة. جرّب لوحة مفاتيح إنجليزية أو اضغط نسيت كلمة المرور.";
  if(/operation-not-allowed/.test(c))return"تسجيل الدخول بالبريد غير مفعّل في Firebase (Authentication ← Sign-in method).";
  if(/too-many-requests/.test(c))return"محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.";
  if(/network/.test(c))return"لا يوجد اتصال بالإنترنت.";

  }

  try{if(from==="home")history.pushState({t:t},"");else history.replaceState({t:t},"")}catch(e){}
  render();window.scrollTo(0,0);

  else if(d.regc){S.regOpen=false;S.reg=null;render()}
};
$("view").onchange=function(e){var i=e.target.id,fm=e.target.form;if(fm&&fm.dataset.f==="reg"){var el=fm.elements;S.reg={dept:el.dept.value,stage:el.stage.value,grp:el.grp.value};if(e.target.name==="stage")S.reg.grp="";render();return}if(i==="fd"||i==="fs"||i==="fg"){FL[{fd:"dept",fs:"stage",fg:"grp"}[i]]=e.target.value;try{localStorage.setItem("fl",JSON.stringify(FL))}catch(x){}render()}};
$("view").onsubmit=function(e){
  e.preventDefault();var f=e.target,col=f.dataset.f,o={};
  Array.prototype.forEach.call(f.elements,function(x){if(x.name)o[x.name]=x.value.trim()});
  if(col==="reg"){saveMe(o);S.reg=null;S.regOpen=false;render();return}
  if(col==="login"){auth.signInWithEmailAndPassword(o.email,o.pass).catch(function(e){alert(authMsg(e))});return}
  if(S.edit&&S.edit.col===col){save(col,S.edit.id,o);return}
  if(col==="notes")o.ts=Date.now();
  if(col==="courses")S.addOpen=false;
  add(col,o);
};
try{history.replaceState(null,"")}catch(e){}
render();
</script>
