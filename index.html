<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14235a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="جامعة العين">
<title>جامعة العين العراقية</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#69728a;--pr:#2f5bea;--pr2:#e8eeff;--bd:#e3e6ef;--wa:#c2410c;--wb:#fff1e6;--ok:#0f7b4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#1a1f2d;--tx:#eef1f8;--mu:#9aa3bb;--pr:#7c9bff;--pr2:#232b45;--bd:#2a3144;--wa:#fdba74;--wb:#3a2616;--ok:#5fd6a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131c;--card:#1a1f2d;--tx:#eef1f8;--mu:#9aa3bb;--pr:#7c9bff;--pr2:#232b45;--bd:#2a3144;--wa:#fdba74;--wb:#3a2616;--ok:#5fd6a0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
h1{font-size:19px;margin:0}
.brand{display:flex;align-items:center;gap:10px}.logo{height:54px;width:auto;background:#fff;border-radius:10px;padding:3px;border:1px solid var(--bd)}
.lb{display:grid;font-size:12px;color:var(--mu);gap:2px}.lb.full{grid-column:1/-1}.lb input{font-size:15px;color:var(--tx)}.fl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.tg{font-size:12px;font-weight:600;background:var(--pr2);color:var(--pr);border-radius:99px;padding:1px 8px;margin-inline-start:6px;white-space:nowrap}
.bell{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:12px;width:42px;height:42px;font-size:19px;cursor:pointer;color:var(--tx)}
.bell b{position:absolute;top:-6px;left:-6px;background:#dc2626;color:#fff;font-size:11px;border-radius:99px;min-width:19px;height:19px;line-height:19px;text-align:center;padding:0 4px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font:inherit;font-weight:600;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--pr);color:#fff}
.tabs{margin:12px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.t{font-weight:700}.m{color:var(--mu);font-size:14px}
.day{font-weight:700;color:var(--pr);margin:16px 2px 4px}
.pill{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
.alert{background:var(--wb);color:var(--wa);border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:600}
.new{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr2)}
form.add{display:grid;gap:8px;grid-template-columns:1fr 1fr}
form.add .full{grid-column:1/-1}
input,select,textarea,button.go{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
button.go{background:var(--pr);color:#fff;border:0;font-weight:700;cursor:pointer}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer;padding:0 4px}
.empty{text-align:center;color:var(--mu);padding:26px 0}
.hint{font-size:12px;color:var(--mu);margin-top:6px}

.bell{display:grid;place-items:center;padding:0}
.bell svg,.ti svg,.sic svg,.back svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.bell svg{width:22px;height:22px;stroke-width:1.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{position:relative;border:0;border-radius:22px;padding:16px 15px 15px;color:#fff;text-align:start;font:inherit;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;box-shadow:0 8px 18px rgba(20,35,90,.25);overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile::after{content:"";position:absolute;inset-inline-end:-34px;bottom:-34px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.11)}
.ti{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.ti svg{width:30px;height:30px;stroke-width:1.8}
.tl{display:block;font-size:18px;font-weight:800;line-height:1.3}
.ts{display:block;font-size:13px;opacity:.9;margin-top:2px}
.tb{position:absolute;top:12px;inset-inline-end:12px;background:#ef4444;color:#fff;font-size:12px;min-width:23px;height:23px;line-height:23px;text-align:center;border-radius:99px;padding:0 6px;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.sh{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.sh h2{margin:0;font-size:19px;line-height:1.3}
.back{width:42px;height:42px;border-radius:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.back svg{width:22px;height:22px;stroke-width:2}
.sic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.sic svg{width:24px;height:24px;stroke-width:1.9}
.row>div:first-child{min-width:0;flex:1}
.row>div:last-child{flex:none}
.tg{white-space:normal;display:inline-block;margin-top:3px}
.pill{white-space:nowrap}
html,body{overflow-x:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;position:relative;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:15px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;display:grid;justify-items:center;min-width:66px;-webkit-tap-highlight-color:transparent}
.chip small{font-weight:600;color:var(--mu);font-size:12px}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff;box-shadow:0 4px 10px rgba(47,91,234,.3)}
.chip.on small{color:rgba(255,255,255,.88)}
.chip .dot{position:absolute;top:6px;inset-inline-end:7px;width:7px;height:7px;border-radius:50%;background:#ef4444}
.lec{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--bd);border-inline-start:5px solid var(--pr);border-radius:16px;padding:12px;margin:9px 0}
.lec.lab{border-inline-start-color:#0f9d6b}
.lec .tm{flex:none;width:60px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px;font-variant-numeric:tabular-nums}
.lec .tm b{font-size:17px}
.lec .tm span{font-size:13px;color:var(--mu)}
.lec .bd{flex:1;min-width:0;border-inline-start:1px solid var(--bd);padding-inline-start:12px}
.lec .ac{flex:none;align-self:flex-start;white-space:nowrap}
.kd{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;margin-inline-end:6px;background:var(--pr2);color:var(--pr)}
.lec.lab .kd{background:rgba(15,157,107,.14);color:#0f9d6b}
.now{background:#ef4444;color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;margin-inline-start:6px}
.chip{--c:#2f5bea;background:color-mix(in srgb,var(--c) 13%,var(--card));border-color:color-mix(in srgb,var(--c) 45%,transparent);color:var(--c)}
.chip small{color:var(--c);opacity:.85}
.chip.on{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));border-color:var(--c);color:#fff;box-shadow:0 5px 12px color-mix(in srgb,var(--c) 45%,transparent)}
.chip.on small{color:#fff;opacity:.92}
.lec{--c:#2f5bea;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 11%,var(--card)),var(--card) 70%);border-color:color-mix(in srgb,var(--c) 30%,transparent);border-inline-start:5px solid var(--c)}
.lec.lab{border-inline-start-color:var(--c)}
.lec .tm{background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 62%,#000));color:#fff;border-radius:12px;padding:8px 4px;width:64px}
.lec .tm span{color:rgba(255,255,255,.85)}
.lec .bd{border-inline-start:0;padding-inline-start:0}
.kd,.lec.lab .kd{background:var(--c);color:#fff}
.lec.lab .kd{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.day{color:var(--c,var(--tx))}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:16px;right:16px;margin:auto;max-width:420px;background:#1d2433;color:#fff;padding:12px 16px;border-radius:14px;text-align:center;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:600}
.cf{background:#ef4444!important;color:#fff!important;border-radius:10px;font-size:13px!important;padding:4px 10px!important;font-weight:700}
/* Bottom Nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;align-items:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:90;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bnav button{border:0;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;border-radius:12px;position:relative;transition:color .15s}
.bnav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}
.bnav button.on{color:var(--pr)}
.bnav button.on::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:2px;background:var(--pr)}
.bnav b{position:absolute;top:-2px;right:4px;background:#ef4444;color:#fff;font-size:10px;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:99px;padding:0 3px}
.wrap{padding-bottom:90px}
/* Welcome card */
.welcome{background:linear-gradient(135deg,#14235a 0%,#2f5bea 100%);color:#fff;border-radius:18px;padding:18px 16px;margin:8px 0 14px;position:relative;overflow:hidden}
.welcome::after{content:"";position:absolute;top:-30px;inset-inline-start:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.welcome .wt{font-size:20px;font-weight:800;margin-bottom:2px}
.welcome .ws{font-size:14px;opacity:.85}
/* Quick info cards */
.qcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.qcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.qcard .qi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.qcard .qi svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.9}
.qcard .ql{font-size:12px;color:var(--mu);margin-top:4px}
.qcard .qv{font-size:15px;font-weight:700;line-height:1.3}
/* Section animation */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid,.qcards,.card,.lec,.sh,.welcome{animation:fadeUp .25s ease}
/* Improved tile */
.tile{min-height:130px;border-radius:20px;padding:14px 14px 13px}
.tile .ti{width:46px;height:46px;border-radius:14px}
.tile .ti svg{width:26px;height:26px}
</style>
</head>

function authMsg(e){

  if(/operation-not-allowed/.test(c))return"تسجيل الدخول بالبريد غير مفعّل في Firebase (Authentication ← Sign-in method).";
  if(/too-many-requests/.test(c))return"محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.";
  if(/network/.test(c))return"لا يوجد اتصال بالإنترنت.";

function parseImportFile(file){
  var st=$("impStatus"),ta=$("impNames");
  if(!file){st.textContent="";return}
  var ext=file.name.split(".").pop().toLowerCase();
  st.textContent="⏳ جاري قراءة الملف...";
  if(ext==="csv"){
    var r=new FileReader();r.onload=function(){
      var lines=r.result.split(/\r?\n/).map(function(l){return l.replace(/^"+|"+$/g,"").trim()}).filter(function(l){return l&&!/^\d+$/.test(l)});
      ta.value=lines.join("\n");st.textContent="✅ تم استخراج "+lines.length+" اسم من CSV";
    };r.readAsText(file);
  }else if(ext==="xlsx"||ext==="xls"){
    var r=new FileReader();r.onload=function(){
      try{
        var wb=XLSX.read(r.result,{type:"array"});var names=[];
        wb.SheetNames.forEach(function(sn){
          var ws=wb.Sheets[sn],range=XLSX.utils.decode_range(ws["!ref"]||"A1");
          for(var row=range.s.r;row<=range.e.r;row++){
            for(var col=range.s.c;col<=range.e.c;col++){
              var cell=ws[XLSX.utils.encode_cell({r:row,c:col})];
              if(cell&&cell.v){var v=String(cell.v).trim();if(v&&/[؀-ۿ]/.test(v)&&v.length>4&&!/^\d+$/.test(v))names.push(v)}
            }
          }
        });
        ta.value=names.join("\n");st.textContent="✅ تم استخراج "+names.length+" اسم من Excel";
      }catch(e){st.textContent="❌ خطأ في قراءة الملف: "+e.message}
    };r.readAsArrayBuffer(file);
  }else if(ext==="pdf"){
    if(!window.pdfjsLib){st.textContent="❌ مكتبة PDF غير متوفرة";return}
    var r=new FileReader();r.onload=function(){
      pdfjsLib.getDocument({data:new Uint8Array(r.result)}).promise.then(function(pdf){
        var names=[],done=0;
        for(var i=1;i<=pdf.numPages;i++)(function(pg){
          pdf.getPage(pg).then(function(page){
            page.getTextContent().then(function(tc){
              var lines=[];var lastY=null;var cur="";
              tc.items.forEach(function(item){
                if(lastY!==null&&Math.abs(item.transform[5]-lastY)>2){if(cur.trim())lines.push(cur.trim());cur=""}
                cur+=item.str;lastY=item.transform[5];
              });
              if(cur.trim())lines.push(cur.trim());
              lines.forEach(function(l){
                l=l.replace(/^\d+[\s.\-)\/)]+/,"").trim();
                if(l&&/[؀-ۿ]/.test(l)&&l.length>4&&!/^\d+$/.test(l)&&l.indexOf("اسم الطالب")<0&&l.indexOf("القسم")<0&&l.indexOf("المرحلة")<0&&l.indexOf("الكروب")<0&&l.indexOf("ت ")<0)names.push(l);
              });
              done++;
              if(done===pdf.numPages){ta.value=names.join("\n");st.textContent="✅ تم استخراج "+names.length+" اسم من PDF";}
            });
          });
        })(i);
      }).catch(function(e){st.textContent="❌ خطأ في قراءة PDF: "+e.message});
    };r.readAsArrayBuffer(file);
  }else{st.textContent="❌ صيغة غير مدعومة. استخدم PDF أو Excel أو CSV"}
}

  // next exam
  h+='<div class="qcard"><div class="qi" style="background:linear-gradient(135deg,#5b45d6,#3b2aa5)">'+IC.exams+'</div>';
  if(up.length){var d=daysLeft(up[0]);h+='<div class="ql">أقرب امتحان</div><div class="qv">'+esc(up[0].course)+'</div><div class="m" style="font-size:12px">'+(d===0?"اليوم":d===1?"غدًا":"بعد "+d+" أيام")+'</div>'}
  else h+='<div class="ql">الامتحانات</div><div class="qv">لا توجد قريباً</div>';
  h+='</div></div>';
  return h;
}
function homeTiles(){
  var cs=S.courses.filter(match),day=new Date().getDay();
  var td=cs.filter(function(c){return +c.day===day}).length;
  var up=S.exams.filter(match).filter(function(e){return daysLeft(e)>=0}).sort(function(a,b){return(a.date+a.time)>(b.date+b.time)?1:-1});
  var ex="لا توجد امتحانات";
  if(up.length){var d=daysLeft(up[0]);ex="التالي: "+(d===0?"اليوم":d===1?"غدًا":"بعد "+d+" أيام")}
  var u=unread(),nt=S.notes.filter(match).filter(function(n){return !n.deleted}).length;
  var stCount=S.students.length;
  var info={sched:cs.length+" محاضرة",today:td?td+" محاضرات اليوم":"لا توجد اليوم",exams:ex,notes:S.role==="student"?(u?u+" جديد":"لا جديد"):nt+" تبليغ",students:stCount+" طالب"};
  var tiles=["today","sched","notes","exams"];
  if(S.role!=="student"&&S.role!=="rep")tiles.push("students");
  return'<div class="grid">'+tiles.map(function(k){
    return'<button class="tile" data-go="'+k+'" style="background:'+SEC[k].c+'"><span class="ti">'+IC[k]+'</span><span><span class="tl">'+SEC[k].t+'</span><span class="ts">'+info[k]+'</span></span>'+(k==="notes"&&S.role==="student"&&u?'<b class="tb">'+u+'</b>':"")+'</button>';
  }).join("")+'</div>';
}
function secHead(t){
  var sub=S.role==="student"&&ME.stage?'<div class="m">المرحلة '+esc(ME.stage)+(ME.grp?" · "+esc(ME.grp):"")+'</div>':"";
  return'<div class="sh"><button class="back" data-go="home" aria-label="رجوع">'+IC.back+'</button><span class="sic" style="background:'+SEC[t].c+'">'+IC[t]+'</span><div><h2>'+SEC[t].t+'</h2>'+sub+'</div></div>';
}
function todayView(){
  var day=new Date().getDay(),h=can("courses")&&S.edit&&S.edit.col==="courses"?formHtml("courses"):"";
  var l=S.courses.filter(match).filter(function(c){return +c.day===day}).sort(function(a,b){return a.start>b.start?1:-1});
  h+='<div class="day" style="--c:'+DCOL[day]+'">'+DAYS[day]+'</div>';
  if(!l.length)return h+'<div class="empty">لا توجد محاضرات اليوم.</div>';
  return h+l.map(function(c){return courseCard(c,true)}).join("");
}
function render(){
  if(!S.ready){$("view").innerHTML='<div class="empty">جارٍ التحميل…</div>';return}
  hdr();
  if(S.role==="student"&&(!ME.stage||S.regOpen)){$("view").innerHTML=loginCard()+previewBar()+regView();return}
  var edAlert=S.role==="prof"?'<div class="alert" style="background:var(--pr2);color:var(--pr)">وضع التحرير: '+(S.view==="dev"?"يمكنك تعديل الجدول والامتحانات والتبليغات":"يمكنك إضافة الامتحانات والتبليغات وتعديلها وحذفها (الجدول للعرض فقط)")+'</div>':"";
  var h=loginCard();
  if(S.view==="head")edAlert='<div class="alert" style="background:var(--pr2);color:var(--pr)">رئيس القسم / العميد: يمكنك تعديل الامتحانات والتبليغات وقوائم الطلاب.</div>';
  if(S.view==="rep")edAlert='<div class="alert" style="background:var(--pr2);color:var(--pr)">ممثل كروب: يمكنك نشر تبليغات لكروبك وحذفها.</div>';
  if(S.tab==="home")h+=previewBar()+edAlert+(S.role==="student"?welcomeCard()+meBar()+installCard()+notifCard()+nearBanner()+quickCards():"")+homeTiles();
  else h+=secHead(S.tab)+edAlert+(S.role==="student"||S.tab==="students"?"":filterBar())+(S.tab==="sched"?schedView():S.tab==="today"?todayView():S.tab==="exams"?examsView():S.tab==="students"?studentsView():notesView());
  $("view").innerHTML=h;
  var impF=$("impFile");if(impF)impF.onchange=function(){if(impF.files[0])parseImportFile(impF.files[0])};
  renderNav();
}
function go(t){
  if(t==="home"){
    if(history.state&&history.state.t){history.back();return}
    S.tab="home";S.edit=null;render();window.scrollTo(0,0);return;
  }
  var from=S.tab;S.tab=t;S.edit=null;S.addOpen=false;S.openGrp=null;S.importing=false;
  try{if(from==="home")history.pushState({t:t},"");else history.replaceState({t:t},"")}catch(e){}
  render();window.scrollTo(0,0);
  if(t==="notes"&&S.role==="student")setTimeout(function(){if(S.tab==="notes"){countViews();saveRead(S.notes.map(function(n){return n.id}));render()}},1500);
}
addEventListener("popstate",function(){S.tab="home";S.edit=null;render()});
$("bell").onclick=function(){go("notes")};
$("view").onclick=function(e){var gt=e.target.closest&&e.target.closest("[data-go]");if(gt){go(gt.dataset.go);return}
  var hb=e.target.closest&&e.target.closest("[data-hist]");if(hb){var hp=hb.dataset.hist.split(":");S.hist[hp[0]]=hp[1]==="1";render();return}
  var ch=e.target.closest&&e.target.closest("[data-day]");if(ch){S.selDay=+ch.dataset.day;render();return}
  var og=e.target.closest&&e.target.closest("[data-opengrp]");if(og){S.openGrp=og.dataset.opengrp;S.importing=false;render();window.scrollTo(0,0);return}
  var d=e.target.dataset||{};
  if(d.v){S.view=d.v;S.role=(d.v==="student"||d.v==="rep")?"student":"prof";S.edit=null;render()}
  else if(d.d)twoTap(d.d+d.id,function(){del(d.d,d.id)});
  else if(d.pd){twoTap("pd"+d.pd,function(){if(db)db.collection("notes").doc(d.pd).delete().then(function(){toast("حُذف التبليغ نهائياً")}).catch(fail)})}
  else if(d.lo){twoTap("lo",function(){S.login=false;auth.signOut()})}
  else if(d.ap){var q=S.reqs.filter(function(r){return r.id===d.ap})[0];if(q&&db){var b=db.batch();b.set(db.collection("admins").doc(q.id),{role:"rep",name:q.name,dept:q.dept,stage:q.stage,grp:q.grp,email:q.email||""});b.delete(db.collection("repRequests").doc(q.id));b.commit().then(function(){toast("تمت الموافقة — أصبح ممثلاً")}).catch(fail)}}
  else if(d.rj){if(db)db.collection("repRequests").doc(d.rj).update({status:"rejected"}).then(function(){toast("تم رفض الطلب")}).catch(fail)}
  else if(d.e){S.edit={col:d.e,id:d.id};render();window.scrollTo(0,0)}
  else if(d.cancel){S.edit=null;render()}
  else if(d.seed){twoTap("seed",seedAll)}
  else if(d.seedst){twoTap("seedSt",seedStudents)}
  else if(d.grpback){S.openGrp=null;S.importing=false;render();window.scrollTo(0,0)}
  else if(d.imptog){S.importing=!S.importing;render()}
  else if(d.impclose){S.importing=false;render()}
  else if(d.hideinst){try{localStorage.setItem("hideInstall","1")}catch(x){}render()}
  else if(d.notif){try{Notification.requestPermission().then(function(){render()})}catch(x){}}
  else if(d.forgot){forgot()}
  else if(d.addc!==undefined){S.addOpen=d.addc==="1";render()}
  else if(d.reg){S.regOpen=true;S.reg={fac:ME.fac||facOf(ME.dept),dept:ME.dept||"",stage:ME.stage||"",grp:ME.grp||""};render()}
  else if(d.regc){S.regOpen=false;S.reg=null;render()}
};
$("view").onchange=function(e){var i=e.target.id,fm=e.target.form;if(fm&&fm.dataset.f==="rep"){var el0=fm.elements;S.rr={name:el0["name"].value,dept:el0.dept.value,stage:el0.stage.value,grp:el0.grp.value};if(e.target.name==="stage")S.rr.grp="";render();return}if(fm&&fm.dataset.f==="reg"){var el=fm.elements;S.reg={fac:el.fac.value,dept:el.dept.value,stage:el.stage.value,grp:el.grp.value};if(e.target.name==="fac")S.reg.dept=depsOf(S.reg.fac).length?"":S.reg.fac;if(e.target.name==="stage")S.reg.grp="";render();return}if(i==="fd"||i==="fs"||i==="fg"){FL[{fd:"dept",fs:"stage",fg:"grp"}[i]]=e.target.value;try{localStorage.setItem("fl",JSON.stringify(FL))}catch(x){}render()}};
$("view").onsubmit=function(e){
  e.preventDefault();var f=e.target,col=f.dataset.f,o={};
  Array.prototype.forEach.call(f.elements,function(x){if(x.name)o[x.name]=x.value.trim()});
  if(col==="reg"){saveMe(o);S.reg=null;S.regOpen=false;render();return}
  if(col==="login"){auth.signInWithEmailAndPassword(o.email,o.pass).catch(function(e){toast(authMsg(e))});return}
  if(S.edit&&S.edit.col===col){var k=col==="notes"?"from":"by",old=S[col].filter(function(x){return x.id===S.edit.id})[0]||{};if(MYNAME&&!old[k])o[k]=MYNAME;save(col,S.edit.id,o);return}
  if(col==="rep"){var cu=auth&&auth.currentUser;if(!cu)return;if(!o.name||!o.dept||!o.stage||!o.grp){toast("أكمل كل الحقول");return}
    db.collection("repRequests").doc(cu.uid).set({name:o.name,dept:o.dept,stage:o.stage,grp:o.grp,email:cu.email||"",status:"pending",ts:Date.now()}).then(function(){S.rr=null;toast("أُرسل طلبك وبانتظار الموافقة")}).catch(fail);return}
  if(col==="importList"){
    var lines=o.names.split("\n").map(function(l){return l.trim()}).filter(function(l){return l.length>0});
    if(!lines.length){toast("الصق أسماء الطلاب أولاً");return}
    if(!o.stage||!o.grp){toast("اختر المرحلة والكروب");return}
    if(!db)return;
    var n=0,total=lines.length;
    lines.forEach(function(name){
      var rec={name:name,dept:o.dept||"",stage:o.stage,grp:o.grp,ts:Date.now()};
      if(MYUID)rec.addedBy=MYUID;
      db.collection("students").add(rec).then(function(){n++;if(n===total){toast("تم استيراد "+n+" طالب");S.importing=false;render()}}).catch(fail);
    });
    return;
  }
  if(col==="students"){
    o.ts=Date.now();if(MYUID)o.addedBy=MYUID;
    if(!o.name){toast("اكتب اسم الطالب");return}
    add("students",o);return;
  }
  if(col==="notes"){o.ts=Date.now();if(MYUID)o.uid=MYUID}
  if(col==="notes"&&S.view==="rep"){o.stage=REPINFO.stage||ME.stage||"";o.grp=o.target==="stage"?"":(REPINFO.grp||ME.grp||"");delete o.target;o.dept=REPINFO.dept||ME.dept||"";o.from=repLabel()}
  else if((col==="notes"||col==="exams")&&MYNAME)o[col==="notes"?"from":"by"]=MYNAME;
  if(col==="courses")S.addOpen=false;
  add(col,o);
};
try{history.replaceState(null,"")}catch(e){}
// Bottom navigation
var navEl=document.createElement("nav");navEl.className="bnav";navEl.id="bnav";document.body.appendChild(navEl);
var NAVS=[["home","الرئيسية",svg('<path d="M3 10.5L12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5h-4.75v-6.25h-3.5v6.25H5.5A1.5 1.5 0 0 1 4 20z"/>')],["today","اليوم",IC.today],["sched","الجدول",IC.sched],["notes","التبليغات",IC.notes],["exams","الامتحانات",IC.exams],["students","الطلاب",IC.students]];
function renderNav(){
  var u=unread(),h="";
  NAVS.forEach(function(n){
    if(n[0]==="students"&&(S.role==="student"||S.role==="rep"))return;
    var on=S.tab===n[0]||(S.tab==="home"&&n[0]==="home");
    h+='<button data-nav="'+n[0]+'"'+(on?' class="on"':"")+'>'+n[2]+(n[0]==="notes"&&S.role==="student"&&u?'<b>'+u+'</b>':"")+n[1]+'</button>';
  });
  $("bnav").innerHTML=h;
}
navEl.onclick=function(e){var b=e.target.closest("[data-nav]");if(b)go(b.dataset.nav)};
render();
</script>
